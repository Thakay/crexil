# Runs scripts/check.sh on every push to main. The job holds no secret or key and never sets
# LIVE_CATALOG or LIVE_ELEVENLABS: each test session seals itself (cockpit/server/tests/hermetic.py),
# so no test reaches a live engine or a paid API. Its token only reads the repository.
name: Checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Install the server's packages
        working-directory: cockpit/server
        run: uv sync --frozen

      - name: Install the client's packages
        working-directory: cockpit/web
        run: npm ci

      - name: Run the checks
        run: scripts/check.sh
