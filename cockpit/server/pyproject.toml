[project]
name = "cockpit-server"
version = "0.1.0"
description = "Crexil cockpit backend: orchestrates ComfyUI, the 3D runner and external providers. Never generates anything itself."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.11",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12",
    "aiosqlite>=0.20",
    "python-dotenv>=1.2",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The narrow, semantic ruleset: pyflakes, the E7/E9 syntax-level pycodestyle
# rules, bugbear, simplify, return, unused-argument. E501/I001 are off (129 of
# the 260 broad findings, no value here); `ruff format` is not adopted.
# Run through scripts/check.sh, which also covers scripts/.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E7", "E9", "B", "SIM", "RET", "ARG"]
# B904 (`raise ... from`) is cosmetic here: every site is a FastAPI
# `raise HTTPException` inside an except; capture.py chains the causes that
# matter.
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
# test doubles and fixtures take the signatures they are handed
"**/tests/*.py" = ["ARG"]
