# Shared model tree for ComfyUI (its extra_model_paths.yaml format). Every tool that
# loads weights (the cockpit, ComfyUI, other clients) reads the same tree, so a download
# is shared. Weights are never in git. Under WSL keep the tree on the Linux filesystem.
# Set base_path to the absolute path of your models directory (MODELS_ROOT, by default
# ~/models), then point ComfyUI at this file with --extra-model-paths-config.
crexil:
  base_path: /path/to/models
  checkpoints: checkpoints
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  clip: clip
  clip_vision: clip_vision
  vae: vae
  loras: loras
  controlnet: controlnet
  ipadapter: ipadapter
  upscale_models: upscale_models
  inpaint: inpaint
  sam2: sam2
  embeddings: embeddings
  configs: configs
